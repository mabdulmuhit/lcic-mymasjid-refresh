<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMasjid Midnight Refresh</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{width:100%;height:100%;border:0}
#notice{position:fixed;top:0;left:0;right:0;background:#222;color:#fff;font:16px sans-serif;padding:12px;z-index:2;text-align:center}
</style>
<script>
// Replace the URL below with your complete MyMasjid timingscreen URL.
const MYMASJID_URL = "PASTE_YOUR_FULL_MYMASJID_URL_HERE";
// Refresh at 00:05 local TV time each day.
function scheduleRefresh(){
  const now=new Date();
  const next=new Date(now);
  next.setHours(0,5,0,0);
  if(next<=now) next.setDate(next.getDate()+1);
  setTimeout(()=>location.reload(), next-now);
}
window.addEventListener('load',()=>{
  if(MYMASJID_URL.startsWith('http')){
    document.getElementById('display').src=MYMASJID_URL;
    document.getElementById('notice').style.display='none';
  }
  scheduleRefresh();
});
</script>
</head>
<body>
<div id="notice">Please replace the placeholder with your complete MyMasjid timingscreen URL before hosting this page.</div>
<iframe id="display" title="MyMasjid timingscreen"></iframe>
</body>
</html>
