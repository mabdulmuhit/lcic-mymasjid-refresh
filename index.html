<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCIC MyMasjid</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>
<body>
<iframe src="https://rb.gy/uhbdtv"></iframe>
<script>
function scheduleRefresh() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(0, 5, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => location.reload(),
    next.getTime() - now.getTime());
}
scheduleRefresh();
</script>
</body>
</html>
